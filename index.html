<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Luxury Pro AR Camera - High Definition</title>

  <!-- MediaPipe Face Detection の読み込み（リアルタイム顔認識用） -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
    }
    /* スマホカメラ映像（ズームはビデオ要素のみに干渉） */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }
    /* AR演出・フレームを重ねるレイヤー */
    #ar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    /* 高解像度対応Canvas */
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    /* ラグジュアリーなトップコントロールバー */
    #top-controls {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(15, 15, 15, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 12px;
      border-radius: 25px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      align-items: center;
    }
    .control-btn {
      background: transparent;
      border: 1px solid rgba(228, 195, 139, 0.5);
      color: #f7f3ed;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 10px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .control-btn.active {
      background: #e4c38b;
      color: #1a1a1a;
      border-color: #e4c38b;
      font-weight: 600;
    }
    .control-btn:active {
      transform: scale(0.95);
    }

    /* ステータス表示 */
    #info-overlay {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(247, 243, 237, 0.75);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    #status { font-weight: 500; color: #e4c38b; }

    /* 最高級メタリック調のシャッターボタン＆下部コントロール */
    #shutter-container {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.4);
    }

    /* 撮影ギャラリー機能用アイコンUI */
    #gallery-thumb {
      position: absolute;
      bottom: 45px;
      left: 30px;
      width: 50px;
      height: 50px;
      border-radius: 12px;
      border: 2px solid rgba(228, 195, 139, 0.8);
      background: rgba(0, 0, 0, 0.5);
      background-size: cover;
      background-position: center;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(228, 195, 139, 0.8);
      font-size: 18px;
    }

    /* ギャラリーモーダル */
    #gallery-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 99;
      flex-direction: column;
      color: #fff;
    }
    #gallery-header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(228, 195, 139, 0.2);
    }
    #gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 15px;
      overflow-y: auto;
      flex: 1;
    }
    .gallery-item {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .close-btn {
      background: transparent;
      border: none;
      color: #e4c38b;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- スマホのカメラ映像 -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- 上部プロフェッショナルコントロールパネル -->
  <div id="top-controls">
    <button class="control-btn active" id="zoom-1x" onclick="setZoom(1)">1x</button>
    <button class="control-btn" id="zoom-2x" onclick="setZoom(2)">2x</button>
    <button class="control-btn" id="zoom-3x" onclick="setZoom(3)">3x</button>
    <div style="width: 1px; height: 16px; background: rgba(228,195,139,0.3); margin: 0 2px;"></div>
    <!-- エフェクト ON/OFF & 強弱切り替えボタン -->
    <button class="control-btn" id="effect-btn" onclick="toggleEffectPower()">FX: Mid</button>
    <div style="width: 1px; height: 16px; background: rgba(228,195,139,0.3); margin: 0 2px;"></div>
    <button class="control-btn" onclick="switchCamera()">Cam ⟳</button>
  </div>

  <div id="info-overlay">
    PRO MODE: <span id="status">READY</span> | フレームはドラッグで移動・2本指で拡大縮小
  </div>

  <!-- ARレイヤー -->
  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <!-- 撮影ライブラリサムネイルボタン -->
  <div id="gallery-thumb" onclick="openGallery()">📷</div>

  <!-- シャッターボタン -->
  <div id="shutter-container">
    <button id="shutter-btn" title="Capture"></button>
  </div>

  <!-- 撮影ライブラリ（ギャラリー）モーダル -->
  <div id="gallery-modal">
    <div id="gallery-header">
      <span style="letter-spacing: 0.1em; color: #e4c38b;">LIBRARY</span>
      <button class="close-btn" onclick="closeGallery()">✕</button>
    </div>
    <div id="gallery-grid"></div>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');
    const galleryGrid = document.getElementById('gallery-grid');
    const galleryThumb = document.getElementById('gallery-thumb');

    let capturedPhotos = []; // ライブラリ用画像データ配列

    // --- カメラ＆ズーム・切り替えの状態管理 ---
    let currentZoom = 1;
    let useFrontCamera = false;
    let currentStream = null;

    function setZoom(level) {
      currentZoom = level;
      webcamEl.style.transform = `scale(${currentZoom})`;
      ['1x', '2x', '3x'].forEach(z => {
        const btn = document.getElementById(`zoom-${z}`);
        if (btn) btn.classList.toggle('active', z === `${level}x`);
      });
    }

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: useFrontCamera ? "user" : { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcamEl.srcObject = currentStream;
        statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
      } catch (err) {
        try {
          const fallbackConstraints = { video: true, audio: false };
          currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
          webcamEl.srcObject = currentStream;
          statusEl.textContent = "READY";
        } catch (e) {
          statusEl.textContent = "CAMERA ERROR";
          console.error(e);
        }
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      initCamera();
    }

    initCamera();

    // --- 高解像度 (Retina) 対応のCanvasリサイズ処理 ---
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;

      arCanvas.width = width * dpr;
      arCanvas.height = height * dpr;
      arCanvas.style.width = width + 'px';
      arCanvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- 1.png の読み込み＆高精度透過処理 ---
    let processedFrameImg = null;
    function loadAndProcessFrame() {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = img.naturalWidth || img.width;
        tempCanvas.height = img.naturalHeight || img.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(img, 0, 0);

        const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2];
          if (r > 200 && g > 200 && b > 200) {
            data[i+3] = 0; 
          }
        }
        tempCtx.putImageData(imgData, 0, 0);
        processedFrameImg = tempCanvas;
      };
      img.src = '1.png';
    }
    loadAndProcessFrame();

    // --- MediaPipe Face Detection による人物（顔）認識AIの初期化 ---
    let detectedFaces = [];
    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });
    faceDetection.setOptions({
      model: 'short',
      minDetectionConfidence: 0.5
    });
    faceDetection.onResults((results) => {
      detectedFaces = results.detections || [];
    });

    // 定期的にカメラ画像から顔の位置を更新
    async function processFaceDetection() {
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        await faceDetection.send({ image: webcamEl });
      }
      setTimeout(processFaceDetection, 120);
    }
    webcamEl.addEventListener('loadeddata', () => {
      processFaceDetection();
    });

    // --- フレームの位置・サイズ・タッチ操作管理 ---
    let frameScale = 1.0;
    let frameOffsetX = 0;
    let frameOffsetY = 0;

    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    let initialDistance = null;
    let initialScale = 1.0;

    // エフェクト強弱 & ON/OFF 設定 (0: OFF, 1: Low, 2: Mid, 3: High)
    let effectPowerLevel = 2;
    function toggleEffectPower() {
      effectPowerLevel = (effectPowerLevel + 1) % 4;
      const names = { 0: 'OFF', 1: 'Low', 2: 'Mid', 3: 'High' };
      const btn = document.getElementById('effect-btn');
      btn.textContent = `FX: ${names[effectPowerLevel]}`;
      btn.classList.toggle('active', effectPowerLevel > 0);
    }

    // タッチ・マウス操作イベント
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        dragStartX = e.touches[0].clientX - frameOffsetX;
        dragStartY = e.touches[0].clientY - frameOffsetY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = frameScale;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        frameOffsetX = e.touches[0].clientX - dragStartX;
        frameOffsetY = e.touches[0].clientY - dragStartY;
      } else if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        frameScale = Math.max(0.4, Math.min(2.5, initialScale * factor));
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) isDragging = false;
      if (e.touches.length < 2) initialDistance = null;
    });

    // --- パーティクルシステム ---
    const particles = [];
    for (let i = 0; i < 45; i++) {
      particles.push({
        type: 'petal',
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 12 + 8,
        speedY: Math.random() * 1.4 + 0.7,
        speedX: (Math.random() - 0.5) * 1.2,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 2.0,
        swaySpeed: Math.random() * 0.012 + 0.006,
        swayAmp: Math.random() * 40 + 20,
        initialX: Math.random() * window.innerWidth,
        opacity: Math.random() * 0.35 + 0.65,
        colorVariant: Math.random() > 0.4 ? '#ffb7c5' : '#ffd1dc'
      });
    }

    for (let i = 0; i < 30; i++) {
      particles.push({
        type: 'sparkle',
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 3.5 + 1.2,
        speedY: Math.random() * 0.7 + 0.2,
        speedX: (Math.random() - 0.5) * 0.4,
        opacity: Math.random() * 0.8 + 0.2
      });
    }

    let timeCount = 0;

    // 人物の顔領域に重なっているかを判定する関数
    function isOverlappingFace(px, py, logicalWidth, logicalHeight) {
      for (const detection of detectedFaces) {
        const bbox = detection.boundingBox;
        // 画面サイズ座標へ変換
        const faceX = (1 - bbox.xCenter) * logicalWidth; // インカメ左右反転等考慮のセンター座標
        const faceY = bbox.yCenter * logicalHeight;
        const faceRadius = Math.max(bbox.width * logicalWidth, bbox.height * logicalHeight) * 0.8;

        const dist = Math.hypot(px - faceX, py - faceY);
        if (dist < faceRadius) {
          return true; // 顔に重なっている
        }
      }
      return false;
    }

    function drawPetal(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.globalAlpha = p.opacity;

      const grad = ctx.createRadialGradient(0, -p.size * 0.2, 0, 0, 0, p.size * 1.2);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.4, p.colorVariant);
      grad.addColorStop(1, '#ff7b93');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, -p.size);
      ctx.bezierCurveTo(p.size * 0.9, -p.size * 1.4, p.size * 1.2, p.size * 0.4, 0, p.size * 1.1);
      ctx.bezierCurveTo(-p.size * 1.2, p.size * 0.4, -p.size * 0.9, -p.size * 1.4, 0, -p.size);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(0, -p.size * 0.7);
      ctx.lineTo(0, p.size * 0.3);
      ctx.stroke();

      ctx.restore();
    }

    // --- メイン描画ループ ---
    function renderLoop() {
      timeCount += 0.016;
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      // --- A. フレームの描画 ---
      const floatOffsetY = Math.sin(timeCount * 1.5) * 6;
      const baseW = Math.min(logicalWidth * 0.75, 420) * frameScale;
      const baseH = baseW * 1.414;
      const frameX = (logicalWidth - baseW) / 2 + frameOffsetX;
      const frameY = (logicalHeight - baseH) / 2 + floatOffsetY + frameOffsetY;

      if (processedFrameImg) {
        ctx.save();
        ctx.shadowColor = 'rgba(228, 195, 139, 0.65)';
        ctx.shadowBlur = 35;
        ctx.drawImage(processedFrameImg, frameX, frameY, baseW, baseH);
        ctx.restore();
      } else {
        ctx.strokeStyle = 'rgba(228, 195, 139, 0.85)';
        ctx.lineWidth = 5;
        ctx.strokeRect(frameX, frameY, baseW, baseH);
      }

      // --- B. パーティクルの描写（ON/OFF ＆ 顔回避処理） ---
      if (effectPowerLevel > 0) {
        const activeCount = effectPowerLevel === 1 ? 0.4 : (effectPowerLevel === 2 ? 0.7 : 1.2);

        particles.forEach((p, index) => {
          p.y += p.speedY * activeCount;
          if (p.type === 'petal') {
            p.x = p.initialX + Math.sin(p.y * p.swaySpeed) * p.swayAmp;
            p.rotation += p.rotSpeed;

            if (p.y > logicalHeight + 40) {
              p.y = -40;
              p.initialX = Math.random() * logicalWidth;
            }

            // AI顔認識で顔の前面にかぶる場合は描画を回避
            if (!isOverlappingFace(p.x, p.y, logicalWidth, logicalHeight)) {
              drawPetal(ctx, p);
            }
          } else if (p.type === 'sparkle' && effectPowerLevel >= 2) {
            p.x += p.speedX;
            const pulse = 0.5 + Math.sin(timeCount * 5 + index * 1.5) * 0.5;
            const currentAlpha = Math.max(0, p.opacity * pulse);

            if (p.y > logicalHeight + 20) {
              p.y = -20;
              p.x = Math.random() * logicalWidth;
            }

            if (!isOverlappingFace(p.x, p.y, logicalWidth, logicalHeight)) {
              ctx.save();
              ctx.globalAlpha = currentAlpha;
              ctx.fillStyle = '#ffea9f';
              ctx.shadowColor = '#fff3bf';
              ctx.shadowBlur = 12;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * (effectPowerLevel === 3 ? 1.3 : 1.0), 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          }
        });
      }

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // --- シャッター機能（JPG自動保存 ＆ ライブラリ格納） ---
    shutterBtn.addEventListener('click', () => {
      const saveCanvas = document.createElement('canvas');
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;
      
      saveCanvas.width = logicalWidth * dpr;
      saveCanvas.height = logicalHeight * dpr;
      const saveCtx = saveCanvas.getContext('2d');
      saveCtx.scale(dpr, dpr);

      // 1. カメラ映像を描画
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vW = webcamEl.videoWidth;
        const vH = webcamEl.videoHeight;
        const vRatio = vW / vH;
        const cRatio = logicalWidth / logicalHeight;

        let dw = logicalWidth, dh = logicalHeight, dx = 0, dy = 0;
        if (vRatio > cRatio) {
          dw = logicalHeight * vRatio;
          dx = (logicalWidth - dw) / 2;
        } else {
          dh = logicalWidth / vRatio;
          dy = (logicalHeight - dh) / 2;
        }

        saveCtx.save();
        saveCtx.translate(logicalWidth / 2, logicalHeight / 2);
        saveCtx.scale(currentZoom, currentZoom);
        saveCtx.translate(-logicalWidth / 2, -logicalHeight / 2);
        saveCtx.drawImage(webcamEl, dx, dy, dw, dh);
        saveCtx.restore();
      }

      // 2. AR演出キャンバスをそのまま合成
      saveCtx.drawImage(arCanvas, 0, 0, logicalWidth, logicalHeight);

      // 3. JPGデータ生成（品質: 0.95）
      const imgDataUrl = saveCanvas.toDataURL('image/jpeg', 0.95);

      // 端末へ自動保存（ダウンロード）
      const link = document.createElement('a');
      link.download = 'luxury_pro_hanami_' + Date.now() + '.jpg';
      link.href = imgDataUrl;
      link.click();

      // ライブラリ配列に追加してサムネイルを更新
      capturedPhotos.unshift(imgDataUrl);
      galleryThumb.style.backgroundImage = `url(${imgDataUrl})`;
      galleryThumb.textContent = '';
    });

    // ギャラリーモーダル制御
    function openGallery() {
      if (capturedPhotos.length === 0) {
        alert("撮影した写真がまだありません。");
        return;
      }
      galleryGrid.innerHTML = '';
      capturedPhotos.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.className = 'gallery-item';
        galleryGrid.appendChild(img);
      });
      document.getElementById('gallery-modal').style.display = 'flex';
    }

    function closeGallery() {
      document.getElementById('gallery-modal').style.display = 'none';
    }
  </script>
</body>
</html>
