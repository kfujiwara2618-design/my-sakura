<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ARお花見カメラ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 999;
      pointer-events: none;
      text-align: center;
    }
    #status { font-weight: bold; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }

    /* シャッターボタンのスタイル */
    #shutter-container {
      position: absolute;
      bottom: 30px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 999;
    }
    #shutter-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #ffffff;
      border: 5px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    #shutter-btn:active {
      transform: scale(0.9);
      background: #ffb7c5;
    }
  </style>

  <!-- A-Frame & MindAR の読み込み -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- 桜の花びらを降らせるカスタムコンポーネント -->
  <script>
    AFRAME.registerComponent('sakura-rain', {
      init: function () {
        const el = this.el;
        this.petals = [];
        // 花びらを25枚生成
        for (let i = 0; i < 25; i++) {
          const petal = document.createElement('a-plane');
          petal.setAttribute('width', '0.08');
          petal.setAttribute('height', '0.08');
          petal.setAttribute('color', '#ffb7c5');
          petal.setAttribute('material', 'transparent: true; opacity: 0.85; shader: flat;');
          
          // ランダムな初期位置
          const x = (Math.random() - 0.5) * 2.5;
          const y = Math.random() * 2 + 0.5;
          const z = (Math.random() - 0.5) * 2.5;
          petal.setAttribute('position', `${x} ${y} ${z}`);
          
          // ランダムな回転
          petal.setAttribute('rotation', `${Math.random()*360} ${Math.random()*360} 0`);
          
          el.appendChild(petal);
          this.petals.push({
            el: petal,
            speedY: 0.003 + Math.random() * 0.004,
            speedX: 0.001 + Math.random() * 0.002,
            rotSpeed: Math.random() * 2
          });
        }
      },
      tick: function (time, deltaTime) {
        // 花びらを舞い散らせるアニメーション処理
        this.petals.forEach((p, index) => {
          const pos = p.el.getAttribute('position');
          pos.y -= p.speedY;
          pos.x += Math.sin(time * 0.002 + index) * p.speedX;
          
          // 下まで落ちたら上に戻す
          if (pos.y < -0.5) {
            pos.y = 2.0;
            pos.x = (Math.random() - 0.5) * 2.5;
          }
          p.el.setAttribute('position', pos);
        });
      }
    });
  </script>
</head>
<body>

  <!-- 操作ガイドの表示 -->
  <div id="info-overlay">
    <div>状態: <span id="status">準備中...</span></div>
    <div style="margin-top: 4px; font-size: 10px; color: #ddd;">マーカーをかざして花見を体験 / 2本指: 拡大縮小</div>
  </div>

  <!-- シャッターボタン -->
  <div id="shutter-container">
    <button id="shutter-btn" title="写真を撮影"></button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- お花見用のメイン画像（必要に応じて画像ファイルを変更してください） -->
      <img id="hanamiImg" src="1.jpg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカーを認識したときに表示されるターゲット＆桜のエフェクト -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <!-- メインの画像プレーン -->
      <a-plane 
        id="slidePlane" 
        src="#hanamiImg" 
        position="0 0 0" 
        width="1" 
        height="1.414" 
        scale="1 1 1">
      </a-plane>

      <!-- 舞い散る桜の花びらエフェクト -->
      <a-entity sakura-rain></a-entity>
    </a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');
    const slidePlane = document.querySelector('#slidePlane');
    const targetEntity = document.querySelector('#targetEntity');
    const shutterBtn = document.getElementById('shutter-btn');

    // カメラ起動・エラーの判定
    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "カメラ起動成功！マーカーをかざしてください";
      statusEl.className = "success";
    });

    sceneEl.addEventListener("arError", () => {
      statusEl.textContent = "エラー: targets.mind の読み込み失敗";
      statusEl.className = "error";
    });

    targetEntity.addEventListener('targetFound', () => {
      statusEl.textContent = 'お花見AR展開中！桜が舞っています';
      statusEl.className = 'success';
    });

    targetEntity.addEventListener('targetLost', () => {
      statusEl.textContent = 'マーカーを検索中...';
      statusEl.className = '';
    });

    // ピンチイン・ピンチアウト（拡大縮小）の処理
    let initialDistance = null;
    let initialScale = 1;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (slidePlane) {
          const s = slidePlane.getAttribute('scale');
          if (s) initialScale = s.x;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!slidePlane) return;
      if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.2, Math.min(3.0, initialScale * factor));
        slidePlane.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialDistance = null;
      }
    });

    // シャッター機能（カメラ背景動画 ＋ 3D/AR描画を合成して画像として保存）
    shutterBtn.addEventListener('click', () => {
      const videoEl = document.querySelector('video');
      const arCanvas = sceneEl.renderer.domElement;

      // 撮影用の一時キャンバスを作成
      const canvas = document.createElement('canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');

      // 1. スマホのカメラ映像（背景）を描画
      if (videoEl) {
        ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      }

      // 2. その上からARの描画（画像 ＆ 桜の花びら）を合成
      ctx.drawImage(arCanvas, 0, 0, canvas.width, canvas.height);

      // 3. 画像ファイルを生成してダウンロードリンクを実行
      const link = document.createElement('a');
      link.download = 'ar_hanami_' + Date.now() + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
