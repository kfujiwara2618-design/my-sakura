<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>常時お花見ARカメラ（背景透過対応）</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
      touch-action: none;
    }
    /* スマホカメラ映像を背景いっぱいに表示 */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }
    /* AR演出・フレームを重ねるレイヤー */
    #ar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    /* 描画・合成用のメインCanvas（フレーム ＆ 花びら） */
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    /* ガイド・ステータス表示 */
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 10;
      pointer-events: none;
      text-align: center;
    }
    #status { font-weight: bold; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }

    /* シャッターボタンのスタイル */
    #shutter-container {
      position: absolute;
      bottom: 30px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
    }
    #shutter-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #ffffff;
      border: 5px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    #shutter-btn:active {
      transform: scale(0.9);
      background: #ffb7c5;
    }
  </style>
</head>
<body>

  <!-- スマホのカメラ映像 -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- ARレイヤー（Canvasでフレームと花びらを一括描画・透過合成） -->
  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <!-- 操作ガイド -->
  <div id="info-overlay">
    <div>状態: <span id="status">カメラ起動中...</span></div>
    <div style="margin-top: 4px; font-size: 10px; color: #ddd;">2本指でフレームの拡大・縮小ができます</div>
  </div>

  <!-- シャッターボタン -->
  <div id="shutter-container">
    <button id="shutter-btn" title="写真を撮影"></button>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');

    // 画面解像度に合わせてCanvasサイズを調整
    function resizeCanvas() {
      arCanvas.width = window.innerWidth;
      arCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // カメラ（スマホの背面カメラ）を起動
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        webcamEl.srcObject = stream;
        statusEl.textContent = "お花見カメラ起動中！桜が舞っています";
        statusEl.className = "success";
      } catch (err) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
          webcamEl.srcObject = stream;
          statusEl.textContent = "お花見カメラ起動中！桜が舞っています";
          statusEl.className = "success";
        } catch (e) {
          statusEl.textContent = "エラー: カメラの起動に失敗しました";
          statusEl.className = "error";
          console.error(e);
        }
      }
    }
    initCamera();

    // 1.jpg を読み込み、白背景を自動透過（白抜き）処理する
    let processedFrameImg = null;
    function loadAndProcessFrame() {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = img.width;
        tempCanvas.height = img.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(img, 0, 0);

        // 画像のピクセルデータを取得して白に近い部分を透明化
        const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2];
          // 白っぽい背景（RGBすべて210以上）を透明にする
          if (r > 210 && g > 210 && b > 210) {
            data[i+3] = 0; // Alpha = 0 (完全透過)
          }
        }
        tempCtx.putImageData(imgData, 0, 0);
        processedFrameImg = tempCanvas;
      };
      img.onerror = () => {
        console.warn("1.jpg の読み込みに失敗しました。枠線のみで描画します。");
      };
      img.src = '1.jpg';
    }
    loadAndProcessFrame();

    // 桜の花びらパーティクル設定
    const petals = [];
    const petalCount = 35;
    for (let i = 0; i < petalCount; i++) {
      petals.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 8 + 5,
        speedY: Math.random() * 2 + 1,
        speedX: (Math.random() - 0.5) * 1.5,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 4,
        opacity: Math.random() * 0.5 + 0.5
      });
    }

    // フレームのサイズ・拡大縮小の管理変数
    let frameScale = 1.0;

    // メインの描画ループ（アニメーション）
    function renderLoop() {
      ctx.clearRect(0, 0, arCanvas.width, arCanvas.height);

      // --- A. 中央のフレーム（1.jpg・背景透過）の描画 ---
      const baseW = Math.min(window.innerWidth * 0.75, 400) * frameScale;
      const baseH = baseW * 1.414; // 比率 1:1.414
      const frameX = (arCanvas.width - baseW) / 2;
      const frameY = (arCanvas.height - baseH) / 2;

      if (processedFrameImg) {
        ctx.drawImage(processedFrameImg, frameX, frameY, baseW, baseH);
      } else {
        // 画像読み込み前のフォールバック（枠線）
        ctx.strokeStyle = 'rgba(255, 183, 197, 0.8)';
        ctx.lineWidth = 6;
        ctx.strokeRect(frameX, frameY, baseW, baseH);
      }

      // --- B. 舞い散る花びらの描画 ---
      petals.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX + Math.sin(p.y * 0.01) * 0.6;
        p.rotation += p.rotSpeed;

        if (p.y > arCanvas.height + 20) {
          p.y = -20;
          p.x = Math.random() * arCanvas.width;
        }
        if (p.x > arCanvas.width + 20) p.x = -20;
        if (p.x < -20) p.x = arCanvas.width + 20;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.globalAlpha = p.opacity;

        ctx.fillStyle = '#ffb7c5';
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // 2本指によるピンチイン・ピンチアウト（拡大縮小）の処理
    let initialDistance = null;
    let initialScale = 1.0;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = frameScale;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        frameScale = Math.max(0.4, Math.min(2.5, initialScale * factor));
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialDistance = null;
      }
    });

    // シャッター機能（カメラ背景 ＋ 透過フレーム ＋ 花びらを1枚の画像に合成して保存）
    shutterBtn.addEventListener('click', () => {
      const saveCanvas = document.createElement('canvas');
      saveCanvas.width = window.innerWidth;
      saveCanvas.height = window.innerHeight;
      const saveCtx = saveCanvas.getContext('2d');

      // 1. スマホカメラの背景映像を描画
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vRatio = webcamEl.videoWidth / webcamEl.videoHeight;
        const cRatio = saveCanvas.width / saveCanvas.height;
        let w = saveCanvas.width, h = saveCanvas.height, x = 0, y = 0;
        if (vRatio > cRatio) {
          w = saveCanvas.height * vRatio;
          x = (saveCanvas.width - w) / 2;
        } else {
          h = saveCanvas.width / vRatio;
          y = (saveCanvas.height - h) / 2;
        }
        saveCtx.drawImage(webcamEl, x, y, w, h);
      }

      // 2. 現在のAR演出（透過フレーム ＆ 舞い散る花びら）のCanvasをそのまま合成
      saveCtx.drawImage(arCanvas, 0, 0);

      // 3. 画像ファイルを生成してダウンロード保存
      const link = document.createElement('a');
      link.download = 'ar_hanami_' + Date.now() + '.png';
      link.href = saveCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
